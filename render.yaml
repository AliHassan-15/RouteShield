{
  "services": [
    {
      "type": "web",
      "name": "routeshield-api",
      "runtime": "python",
      "plan": "free",
      "region": "oregon",
      "rootDir": "backend",
      "buildCommand": "python -m pip install --disable-pip-version-check -r \"./requirements.lock\" && python \"./manage.py\" check --deploy --fail-level ERROR && python \"./manage.py\" collectstatic --noinput",
      "startCommand": "gunicorn --config \"./config/gunicorn.py\" \"config.wsgi:application\"",
      "healthCheckPath": "/api/v1/health/",
      "autoDeploy": true,
      "envVars": [
        {
          "key": "APP_ENV",
          "sync": false
        },
        {
          "key": "DEBUG",
          "sync": false
        },
        {
          "key": "PYTHON_VERSION",
          "sync": false
        },
        {
          "key": "SECRET_KEY",
          "sync": false
        },
        {
          "key": "ALLOWED_HOSTS",
          "sync": false
        },
        {
          "key": "CORS_ALLOWED_ORIGINS",
          "sync": false
        },
        {
          "key": "TRUST_PROXY_SSL_HEADER",
          "sync": false
        },
        {
          "key": "API_TRUSTED_PROXY_CIDRS",
          "sync": false
        },
        {
          "key": "APP_VERSION",
          "sync": false
        },
        {
          "key": "ROUTING_PROVIDER",
          "sync": false
        },
        {
          "key": "WEATHER_PROVIDER",
          "sync": false
        },
        {
          "key": "TOMTOM_API_KEY",
          "sync": false
        },
        {
          "key": "PROVIDER_CONNECT_TIMEOUT_SECONDS",
          "sync": false
        },
        {
          "key": "ROUTING_READ_TIMEOUT_SECONDS",
          "sync": false
        },
        {
          "key": "GEOCODE_READ_TIMEOUT_SECONDS",
          "sync": false
        },
        {
          "key": "ANALYSIS_DEADLINE_SECONDS",
          "sync": false
        },
        {
          "key": "MAX_ROUTE_DISTANCE_MILES",
          "sync": false
        },
        {
          "key": "PROVIDER_ATTEMPTS",
          "sync": false
        },
        {
          "key": "PROVIDER_REQUESTS_PER_SECOND",
          "sync": false
        },
        {
          "key": "PROVIDER_CALL_CONCURRENCY",
          "sync": false
        },
        {
          "key": "PROVIDER_RETRY_BACKOFF_SECONDS",
          "sync": false
        },
        {
          "key": "CACHE_NAMESPACE",
          "sync": false
        },
        {
          "key": "WEATHER_CACHE_TTL_SECONDS",
          "sync": false
        },
        {
          "key": "WEATHER_CACHE_MAX_ENTRIES",
          "sync": false
        },
        {
          "key": "OPEN_METEO_BASE_URL",
          "sync": false
        },
        {
          "key": "OPEN_METEO_MODEL",
          "sync": false
        },
        {
          "key": "WEATHER_ATTEMPTS",
          "sync": false
        },
        {
          "key": "WEATHER_RETRY_BACKOFF_SECONDS",
          "sync": false
        },
        {
          "key": "WEATHER_DAILY_QUOTA_UNITS",
          "sync": false
        },
        {
          "key": "WEATHER_REQUEST_UNIT_LIMIT",
          "sync": false
        },
        {
          "key": "WEATHER_GUSTS_ENABLED",
          "sync": false
        },
        {
          "key": "MAX_WEATHER_COORDINATES",
          "sync": false
        },
        {
          "key": "WEATHER_BATCH_SIZE",
          "sync": false
        },
        {
          "key": "WEATHER_BATCH_CONCURRENCY",
          "sync": false
        },
        {
          "key": "ANALYSIS_RATE_LIMIT",
          "sync": false
        },
        {
          "key": "ANALYSIS_RATE_WINDOW_SECONDS",
          "sync": false
        },
        {
          "key": "GEOCODE_RATE_LIMIT",
          "sync": false
        },
        {
          "key": "GEOCODE_RATE_WINDOW_SECONDS",
          "sync": false
        },
        {
          "key": "SIMULATION_ENABLED",
          "sync": false
        },
        {
          "key": "WEATHER_READ_TIMEOUT_SECONDS",
          "sync": false
        }
      ]
    }
  ]
}
